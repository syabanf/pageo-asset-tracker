<title>PAGEO Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PAGEO Navigator — Design System stylesheet v2 (web + mobile)
   Modern, clean treatment of the PAGEO Operations Tracking brief.
   Class names are stable across v1 → v2.
   ============================================================ */

:root {
  /* Primitive — core palette */
  --pageo-black:  #171A1C;
  --pageo-carbon: #24292D;
  --pageo-slate:  #667078;
  --pageo-steel:  #919A9F;
  --pageo-mist:   #EEF2F4;
  --pageo-fog:    #F7F9FA;
  --pageo-white:  #FFFFFF;
  --pageo-sky:    #C7EBF8;
  --pageo-ocean:  #168FBF;
  --pageo-deep:   #08698F;

  /* Semantic status */
  --s-success: #17875D;
  --s-info:    #168FBF;
  --s-warn:    #D89414;
  --s-crit:    #C43D3D;
  --s-offline: #7C858A;
  --s-unknown: #B1B8BC;
  --s-transit: #4FB7D9;

  --s-success-bg: #E7F5EE;
  --s-info-bg:    #E4F3FA;
  --s-warn-bg:    #FCF2DE;
  --s-crit-bg:    #FBE9E9;
  --s-offline-bg: #EEF0F2;
  --s-unknown-bg: #F3F4F5;
  --s-transit-bg: #E0F4FB;

  /* Map palette */
  --map-land:      #E6ECEF;
  --map-shore:     #C4D5DD;
  --map-sea:       #DFF3FA;
  --map-depth:     #B6E0EF;
  --map-boundary:  #168FBF;

  /* Sequential analytics */
  --seq-1: #DFF3FA; --seq-2: #BCE7F5; --seq-3: #8AD5ED;
  --seq-4: #4FB7D9; --seq-5: #168FBF; --seq-6: #08698F;

  /* Semantic aliases */
  --bg:        #F3F5F7;
  --bg-2:      #F8FAFB;
  --surface:   var(--pageo-white);
  --surface-2: #FBFCFD;
  --border:    #E6EAED;
  --border-2:  #D6DCE0;
  --text:      #1E2327;
  --text-2:    var(--pageo-slate);
  --text-3:    var(--pageo-steel);
  --accent:    var(--pageo-ocean);
  --accent-2:  var(--pageo-deep);
  --accent-bg: #E4F3FA;
  --accent-ring: rgba(22,143,191,.18);

  --shadow-1: 0 1px 2px rgba(20,29,34,.04), 0 1px 3px rgba(20,29,34,.04);
  --shadow-float: 0 8px 24px rgba(20,29,34,.10), 0 2px 6px rgba(20,29,34,.06);
  --shadow-modal: 0 20px 60px rgba(20,29,34,.20), 0 4px 12px rgba(20,29,34,.08);

  --r-xs: 4px; --r-s: 6px; --r-m: 8px; --r-l: 12px; --r-xl: 16px; --r-2xl: 20px; --r-pill: 999px;

  --sidebar-w: 256px;
  --topbar-h: 64px;
  --font: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 14px; line-height: 1.5;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01", "cv05";
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
table { border-collapse: collapse; width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .kpi-value, td.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* ---------- Type scale ---------- */
.t-display { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.t-h1 { font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
.t-h2 { font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.t-h3 { font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.t-body-lg { font-size: 16px; font-weight: 400; }
.t-body { font-size: 14px; font-weight: 400; }
.t-label { font-size: 13px; font-weight: 500; }
.t-caption { font-size: 12px; font-weight: 400; color: var(--text-2); }
.t-micro { font-size: 11px; font-weight: 500; color: var(--text-2); }
.eyebrow, .label-upper {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2);
}
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.strong { font-weight: 600; color: var(--text); }
.ok { color: var(--s-success); } .warn { color: var(--s-warn); } .crit { color: var(--s-crit); } .off { color: var(--s-offline); } .info { color: var(--s-info); }

/* ---------- Icons ---------- */
.ic { width: 20px; height: 20px; flex: 0 0 auto; display: inline-block; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-12 { width: 12px; height: 12px; } .ic-14 { width: 14px; height: 14px; } .ic-16 { width: 16px; height: 16px; } .ic-18 { width: 18px; height: 18px; } .ic-24 { width: 24px; height: 24px; } .ic-32 { width: 32px; height: 32px; } .ic-40 { width: 40px; height: 40px; }

/* ---------- Logo ---------- */
.logo { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
.logo-word { font-weight: 800; font-size: 20px; letter-spacing: .14em; color: #fff; display: inline-flex; align-items: center; }
.logo-word .e { color: var(--pageo-sky); }
.logo-sub { font-size: 9px; letter-spacing: .4em; color: rgba(255,255,255,.5); text-transform: uppercase; }
.logo.dark .logo-word { color: var(--pageo-black); } .logo.dark .logo-word .e { color: var(--accent); } .logo.dark .logo-sub { color: var(--text-2); }

/* ============================================================
   WEB SHELL
   ============================================================ */
.web { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-w) 1fr; background: var(--bg); }

.sidebar {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  background: #14181B; color: #C3CBD1;
  display: flex; flex-direction: column; padding: 22px 14px 18px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent;
}
.sidebar .logo { padding: 2px 12px 22px; }
.sb-group { margin-top: 10px; }
.sb-group > .eyebrow { color: rgba(255,255,255,.34); padding: 6px 12px 6px; font-size: 11px; letter-spacing: .12em; }
.sb-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; margin-bottom: 2px;
  color: #C3CBD1; font-size: 13.5px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .12s, color .12s;
}
.sb-item .ic { width: 18px; height: 18px; color: #8A959C; }
.sb-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.sb-item.active { background: rgba(22,143,191,.20); color: #fff; }
.sb-item.active .ic { color: var(--pageo-sky); }
.sb-item .badge { margin-left: auto; }
.sb-foot { margin-top: auto; padding: 16px 4px 0; }
.sb-foot .user { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.06); }
.sb-foot .name { color: #fff; font-size: 13px; font-weight: 600; }
.sb-foot .role { color: rgba(255,255,255,.5); font-size: 11px; }
.sb-version { font-size: 11px; letter-spacing: .14em; color: rgba(255,255,255,.28); text-transform: uppercase; margin: 16px 0 0 10px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  background: rgba(255,255,255,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 32px;
}
.crumb { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--text-2); }
.crumb .sep { color: var(--border-2); }
.crumb .cur { color: var(--text); font-weight: 600; }
.topbar .search { margin-left: auto; width: 320px; border-radius: var(--r-pill); background: var(--bg); border-color: transparent; }
.topbar .search:focus-within { background: var(--surface); }
.tb-actions { display: flex; align-items: center; gap: 6px; }
.tb-clock { font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: var(--r-pill); background: var(--bg); margin-right: 6px; white-space: nowrap; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); cursor: pointer; position: relative; transition: background .12s, color .12s;
}
.icon-btn .ic { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--bg); color: var(--text); }
.icon-btn.bordered { border-color: var(--border); background: var(--surface); }
.icon-btn .pip { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--s-crit); border: 1.5px solid #fff; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--pageo-sky); color: var(--pageo-deep); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; letter-spacing: .02em; }
.avatar.lg { width: 56px; height: 56px; font-size: 18px; } .avatar.xl { width: 72px; height: 72px; font-size: 24px; }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.avatar.dark { background: var(--pageo-carbon); color: #fff; }
.avatar-stack { display: inline-flex; } .avatar-stack .avatar { border: 2px solid var(--surface); margin-left: -8px; } .avatar-stack .avatar:first-child { margin-left: 0; }

.page { padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 1640px; width: 100%; }
.page.wide { max-width: none; }
.page.flush { padding: 0; gap: 0; max-width: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.page-head .titles { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
.page-head .sub { color: var(--text-2); font-size: 14px; }
.page-head .actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

/* Grid — 12 col, 24 gutter */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.grid.g16 { gap: 16px; }
.c1{grid-column:span 1}.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c10{grid-column:span 10}.c12{grid-column:span 12}
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack.s4 { gap: 4px; } .stack.s8 { gap: 8px; } .stack.s12 { gap: 12px; } .stack.s24 { gap: 24px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.s8 { gap: 8px; } .row.s4 { gap: 4px; } .row.s16 { gap: 16px; } .row.s24 { gap: 24px; }
.row.between { justify-content: space-between; } .row.top { align-items: flex-start; } .row.wrap { flex-wrap: wrap; } .row.end { justify-content: flex-end; }
.grow { flex: 1 1 auto; min-width: 0; }
.divider { height: 1px; background: var(--border); }
.vdivider { width: 1px; align-self: stretch; background: var(--border); }

/* ---------- Card ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-l); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow-1); }
.card.p24 { padding: 24px; } .card.p0 { padding: 0; gap: 0; overflow: hidden; } .card.p16 { padding: 16px; }
.card.floating { box-shadow: var(--shadow-float); border-color: transparent; }
.card.tinted { background: var(--surface-2); box-shadow: none; }
.card.flat { box-shadow: none; }
.card.accent { background: linear-gradient(135deg, #0E7FAD 0%, #08698F 100%); color: #fff; border-color: transparent; }
.card.accent .eyebrow, .card.accent .t-caption, .card.accent .muted { color: rgba(255,255,255,.72); }
.card.dark { background: var(--pageo-black); color: #fff; border-color: transparent; }
.card.dark .eyebrow, .card.dark .t-caption, .card.dark .muted { color: rgba(255,255,255,.6); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-head .eyebrow { margin: 0; }
.card-title { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.card-head .link { font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.card > .card-body { display: flex; flex-direction: column; gap: 12px; }
.card.p0 > .card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.card.p0 > .card-foot { padding: 12px 20px; border-top: 1px solid var(--border); }

/* ---------- KPI ---------- */
.kpi { display: flex; flex-direction: column; gap: 10px; position: relative; }
.kpi .kpi-value { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.03em; color: var(--text); }
.kpi .kpi-value small { font-size: 15px; font-weight: 500; color: var(--text-3); letter-spacing: 0; margin-left: 4px; }
.kpi .kpi-lines { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
.kpi .kpi-lines .num { display: inline-block; min-width: 2.6em; text-align: right; color: var(--text); font-weight: 600; margin-right: 6px; }
.kpi .delta { font-size: 12px; font-weight: 600; color: var(--s-success); display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; background: var(--s-success-bg); padding: 2px 8px 2px 6px; border-radius: var(--r-pill); align-self: flex-start; }
.kpi .delta.down { color: var(--s-crit); background: var(--s-crit-bg); } .kpi .delta.flat { color: var(--text-2); background: var(--bg); }
.kpi.compact { gap: 6px; } .kpi.compact .kpi-value { font-size: 24px; }
.kpi.alert .kpi-value { color: var(--s-crit); }
.kpi .kpi-icon { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 10px; background: var(--bg); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; }
.kpi .kpi-icon .ic { width: 18px; height: 18px; }
.kpi .kpi-icon.accent { background: var(--accent-bg); color: var(--accent-2); }
.kpi .kpi-icon.crit { background: var(--s-crit-bg); color: var(--s-crit); }
.kpi .kpi-icon.ok { background: var(--s-success-bg); color: var(--s-success); }
.kpi .kpi-icon.warn { background: var(--s-warn-bg); color: var(--s-warn); }
.kpi .kpi-spark { position: absolute; right: 18px; bottom: 18px; width: 84px; height: 30px; }
.kpi .kpi-spark svg { width: 100%; height: 100%; overflow: visible; }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }

/* ---------- Status dots & chips ---------- */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--s-unknown); flex: 0 0 auto; }
.dot.ok, .dot.active, .dot.success { background: var(--s-success); }
.dot.info, .dot.onsite, .dot.deployed { background: var(--s-info); }
.dot.transit { background: var(--s-transit); }
.dot.warn, .dot.maint { background: var(--s-warn); }
.dot.crit, .dot.alert { background: var(--s-crit); }
.dot.off, .dot.offline { background: transparent; border: 1.5px solid var(--s-offline); }
.dot.unknown { background: var(--s-unknown); }
.dot.pulse { position: relative; }
.dot.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--s-success); opacity: .5; animation: pulse 2s ease-out infinite; }
.dot.crit.pulse::after { border-color: var(--s-crit); }
@keyframes pulse { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.8); opacity: 0; } }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--s-unknown-bg); color: var(--text-2); line-height: 1; }
.chip .dot { width: 6px; height: 6px; }
.chip.ok, .chip.active, .chip.success { background: var(--s-success-bg); color: #0F5C3E; }
.chip.info, .chip.onsite, .chip.deployed { background: var(--s-info-bg); color: var(--pageo-deep); }
.chip.transit { background: var(--s-transit-bg); color: #0C6E93; }
.chip.warn, .chip.maint { background: var(--s-warn-bg); color: #7E5104; }
.chip.crit, .chip.alert { background: var(--s-crit-bg); color: #8E2323; }
.chip.off, .chip.offline { background: var(--s-offline-bg); color: #4F5A63; }
.chip.unknown { background: var(--s-unknown-bg); color: var(--text-2); }
.chip.neutral { background: var(--pageo-mist); color: var(--text); }
.chip.outline { background: transparent; border: 1px solid var(--border-2); }
.chip.sm { height: 20px; font-size: 11px; padding: 0 8px; }
.chip.lg { height: 28px; font-size: 13px; padding: 0 12px; }

/* Severity badge P1–P4 */
.sev { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 28px; padding: 0 6px; border-radius: var(--r-s); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.sev.p1 { background: var(--s-crit); color: #fff; }
.sev.p2 { background: #E0642F; color: #fff; }
.sev.p3 { background: var(--s-warn); color: #fff; }
.sev.p4 { background: var(--s-info); color: #fff; }

/* Freshness */
.fresh { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.fresh b { font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.fresh.live b { color: var(--s-success); } .fresh.recent b { color: var(--s-info); } .fresh.stale b { color: var(--s-warn); } .fresh.offline b { color: var(--s-offline); }

.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; background: var(--s-crit); color: #fff; }
.badge.neutral { background: rgba(255,255,255,.14); color: #fff; }
.badge.light { background: var(--pageo-mist); color: var(--text-2); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
  background: var(--surface); color: var(--text); transition: background .12s, border-color .12s, color .12s, box-shadow .12s, transform .06s;
}
.btn:active { transform: translateY(1px); }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(8,105,143,.25), inset 0 1px 0 rgba(255,255,255,.12); }
.btn.primary:hover { background: var(--accent-2); }
.btn.secondary { border-color: var(--border-2); color: var(--accent-2); background: var(--surface); }
.btn.secondary:hover { background: var(--accent-bg); border-color: var(--accent); }
.btn.ghost { border-color: var(--border); background: var(--surface); box-shadow: var(--shadow-1); }
.btn.ghost:hover { background: var(--bg-2); border-color: var(--border-2); }
.btn.soft { background: var(--bg); color: var(--text); }
.btn.soft:hover { background: var(--pageo-mist); }
.btn.tertiary { padding: 0 6px; color: var(--accent); background: transparent; }
.btn.tertiary:hover { color: var(--accent-2); background: var(--accent-bg); }
.btn.destructive { border-color: #EFC9C9; color: var(--s-crit); background: var(--surface); }
.btn.destructive:hover { background: var(--s-crit-bg); border-color: var(--s-crit); }
.btn.destructive.solid { background: var(--s-crit); color: #fff; border-color: transparent; }
.btn.dark { background: var(--pageo-black); color: #fff; }
.btn.dark:hover { background: var(--pageo-carbon); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; } .btn.sm .ic { width: 16px; height: 16px; }
.btn.xs { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; } .btn.xs .ic { width: 14px; height: 14px; }
.btn.lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn.icon-only { padding: 0; width: 40px; } .btn.sm.icon-only { width: 32px; } .btn.xs.icon-only { width: 28px; }
.btn:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 12px; font-weight: 500; color: var(--text-2); }
.field .help { font-size: 12px; color: var(--text-3); }
.field .err { font-size: 12px; color: var(--s-crit); display: flex; align-items: center; gap: 4px; }
.field.invalid .input { border-color: var(--s-crit); }
.field.invalid .input:focus-within { box-shadow: 0 0 0 3px rgba(196,61,61,.15); }
.input {
  height: 40px; border: 1px solid var(--border-2); border-radius: 10px; background: var(--surface);
  display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--text); font-size: 14px; min-width: 0; transition: border-color .12s, box-shadow .12s, background .12s;
}
.input:hover { border-color: #C3CBD1; }
.input:focus-within, .input.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.input input, .input select, .input textarea { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 100%; padding: 0; }
.input .ic { color: var(--text-3); width: 18px; height: 18px; }
.input.sm { height: 34px; font-size: 13px; border-radius: 8px; }
.input.select { cursor: pointer; }
.input.select .chev { margin-left: auto; }
.input.disabled { background: var(--bg); color: var(--text-3); }
.input.textarea { height: auto; min-height: 96px; align-items: flex-start; padding: 10px 12px; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filters .input { min-width: 150px; }

/* Segmented control / tabs */
.seg { display: inline-flex; background: var(--pageo-mist); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button, .seg .seg-item { height: 32px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, color .12s; }
.seg .active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(20,29,34,.10), 0 0 0 1px rgba(20,29,34,.04); }
.seg.sm { border-radius: 8px; } .seg.sm button { height: 26px; font-size: 12px; padding: 0 10px; border-radius: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
.tabs .tab { padding: 10px 12px 12px; font-size: 14px; font-weight: 500; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; background: none; border-top: 0; border-left: 0; border-right: 0; display: inline-flex; gap: 8px; align-items: center; border-radius: 6px 6px 0 0; }
.tabs .tab:hover { color: var(--text); background: var(--bg-2); }
.tabs .tab.active { color: var(--accent-2); border-bottom-color: var(--accent); }
.tabs .tab .badge.light { min-width: 20px; }
.tabs.pills { border: 0; gap: 6px; }
.tabs.pills .tab { border: 0; border-radius: var(--r-pill); padding: 6px 14px; margin: 0; }
.tabs.pills .tab.active { background: var(--pageo-black); color: #fff; }

.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--border-2); position: relative; display: inline-block; flex: 0 0 auto; cursor: pointer; border: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.switch.on { background: var(--accent); } .switch.on::after { left: 18px; }
.switch.disabled { opacity: .5; pointer-events: none; }
.checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-2); background: #fff; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; cursor: pointer; transition: background .12s, border-color .12s; }
.checkbox.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.checkbox.on .ic { width: 12px; height: 12px; } .checkbox.on .ic svg { stroke-width: 3; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-2); background: #fff; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.radio.on { border-color: var(--accent); border-width: 5px; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; scrollbar-width: thin; }
.table th, .table td { padding: 12px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
.table th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); background: var(--surface-2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
.table th.sortable { cursor: pointer; }
.table th .ic { width: 12px; height: 12px; display: inline-block; vertical-align: -2px; margin-left: 4px; color: var(--text-3); }
.table tbody tr { transition: background .1s; }
.table tbody tr:hover { background: var(--bg-2); }
.table tbody tr.selected { background: var(--accent-bg); }
.table tr:last-child td { border-bottom: 0; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table .cell-entity { display: flex; align-items: center; gap: 10px; }
.table .cell-entity .sub { font-size: 12px; color: var(--text-2); }
.table .cell-entity .name { font-weight: 600; }
.table.compact th, .table.compact td { padding: 8px 12px; }
.table.comfortable th, .table.comfortable td { padding: 16px 20px; }
.table td.actions { text-align: right; }
.table-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.pager { display: flex; align-items: center; gap: 4px; }
.pager button { height: 28px; min-width: 28px; padding: 0 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; font-size: 12px; cursor: pointer; color: var(--text-2); }
.pager button:hover { border-color: var(--border-2); color: var(--text); }
.pager button.active { background: var(--pageo-black); color: #fff; border-color: var(--pageo-black); }

/* ---------- Key/value lists ---------- */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 24px; font-size: 13px; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.kv.stack { grid-template-columns: 1fr; gap: 12px; }
.kv.stack dt { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.kv.stack dd { margin-top: 2px; font-size: 14px; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px 24px; }
.kv-grid .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.kv-grid .v { font-size: 14px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kv-grid .v.big { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }

/* Stat cluster */
.stat-list { display: flex; flex-direction: column; gap: 10px; }
.stat-list .stat { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.stat-list .stat .n { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.stat-list .stat .l { color: var(--text-2); min-width: 72px; }
.stat-list .stat .bar { flex: 1; height: 6px; background: var(--pageo-mist); border-radius: 3px; overflow: hidden; }
.stat-list .stat .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* Progress */
.progress { height: 6px; background: var(--pageo-mist); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.progress.ok i { background: var(--s-success); } .progress.warn i { background: var(--s-warn); } .progress.crit i { background: var(--s-crit); }
.progress.lg { height: 10px; border-radius: 5px; }
.ring { --p: 0; --c: var(--accent); width: 56px; height: 56px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--pageo-mist) 0); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ring::after { content: ""; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); position: absolute; }
.ring span { position: relative; z-index: 1; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring { position: relative; }
.ring.lg { width: 84px; height: 84px; } .ring.lg::after { width: 68px; height: 68px; } .ring.lg span { font-size: 16px; }
.ring.ok { --c: var(--s-success); } .ring.warn { --c: var(--s-warn); } .ring.crit { --c: var(--s-crit); }

/* ---------- Timeline ---------- */
.timeline { display: flex; flex-direction: column; }
.timeline .tl { display: grid; grid-template-columns: 52px 20px 1fr; gap: 0 8px; align-items: start; position: relative; padding-bottom: 14px; }
.timeline .tl:last-child { padding-bottom: 0; }
.timeline .tl .time { font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; padding-top: 1px; }
.timeline .tl .node { position: relative; height: 100%; display: flex; justify-content: center; }
.timeline .tl .node::before { content: ""; position: absolute; top: 14px; bottom: -14px; width: 1px; background: var(--border); }
.timeline .tl:last-child .node::before { display: none; }
.timeline .tl .node .dot { position: relative; margin-top: 5px; z-index: 1; box-shadow: 0 0 0 3px var(--surface); }
.timeline .tl .body { font-size: 13px; }
.timeline .tl .body .sub { font-size: 12px; color: var(--text-2); margin-top: 1px; }
.timeline .tl .body b { font-weight: 600; }

/* Event feed rows */
.feed { display: flex; flex-direction: column; }
.feed .ev { display: grid; grid-template-columns: 48px 32px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed .ev:last-child { border-bottom: 0; }
.feed .ev .time { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.feed .ev > .ic { color: var(--text-2); width: 32px; height: 32px; padding: 7px; border-radius: 9px; background: var(--bg); }
.feed .ev .sub { color: var(--text-2); font-size: 12px; }

/* ---------- Alert card ---------- */
.alert-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-l); padding: 16px 16px 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; box-shadow: var(--shadow-1); }
.alert-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--s-unknown); }
.alert-card.p1::before, .alert-card.crit::before { background: var(--s-crit); }
.alert-card.p2::before { background: #E0642F; }
.alert-card.p3::before, .alert-card.warn::before { background: var(--s-warn); }
.alert-card.p4::before, .alert-card.info::before { background: var(--s-info); }
.alert-card.crit { border-color: #F0CFCF; background: #FFF9F9; }
.alert-card .a-head { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.alert-card.p1 .a-head, .alert-card.crit .a-head { color: var(--s-crit); }
.alert-card.p2 .a-head { color: #B84E1F; } .alert-card.p3 .a-head, .alert-card.warn .a-head { color: #8A5A05; } .alert-card.p4 .a-head, .alert-card.info .a-head { color: var(--pageo-deep); }
.alert-card .a-head .when { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--text-2); font-size: 12px; }
.alert-card .a-title { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.alert-card .a-meta { font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 2px; }
.alert-card .a-meta b { color: var(--text); font-weight: 500; }
.alert-card .a-actions { display: flex; gap: 8px; margin-top: 4px; }
.alert-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* Banner */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r-l); border: 1px solid var(--border); background: var(--surface); font-size: 13px; }
.banner .ic { flex: 0 0 auto; }
.banner.crit { background: #FFF3F3; border-color: #F0CFCF; color: #7A1F1F; }
.banner.warn { background: var(--s-warn-bg); border-color: #EBD6A8; color: #6E4703; }
.banner.info { background: var(--s-info-bg); border-color: #BFE1F0; color: var(--pageo-deep); }
.banner.ok { background: var(--s-success-bg); border-color: #BFE3D1; color: #0F5C3E; }
.banner.offline { background: var(--s-offline-bg); border-color: var(--border-2); color: var(--text); }
.banner .banner-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------- Map ---------- */
.map { position: relative; background: var(--map-sea); overflow: hidden; border-radius: var(--r-l); min-height: 320px; isolation: isolate; }
.map.flush { border-radius: 0; }
.map > svg.map-base { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.map .map-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.map .map-layer > * { pointer-events: auto; }
.map .map-ui { position: absolute; z-index: 4; }
.map .map-ui.tl { top: 12px; left: 12px; } .map .map-ui.tr { top: 12px; right: 12px; } .map .map-ui.bl { bottom: 12px; left: 12px; } .map .map-ui.br { bottom: 12px; right: 12px; }
.map .map-ui.bc { bottom: 12px; left: 50%; transform: translateX(-50%); }
.map .map-ui.tc { top: 12px; left: 50%; transform: translateX(-50%); }
.map-legend { display: flex; gap: 14px; align-items: center; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.6); box-shadow: var(--shadow-1); border-radius: 10px; padding: 7px 12px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
.map-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.map-legend .sym { width: 12px; height: 12px; display: inline-flex; align-items: center; justify-content: center; }
.map-legend .sym.person { border-radius: 50%; background: var(--accent); }
.map-legend .sym.asset { background: var(--pageo-carbon); transform: rotate(45deg) scale(.8); border-radius: 2px; }
.map-legend .sym.vessel { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid var(--pageo-deep); }
.map-legend .sym.site { background: var(--pageo-slate); border-radius: 2px; }
.map-legend .sym.fence { border: 1.5px dashed var(--accent); border-radius: 2px; }
.map-legend .sym.reader { border-radius: 50%; border: 2px solid var(--pageo-carbon); background: #fff; }
.map-legend .sym.muster { position: relative; } .map-legend .sym.muster::before, .map-legend .sym.muster::after { content: ""; position: absolute; background: var(--s-success); } .map-legend .sym.muster::before { width: 12px; height: 3px; top: 4.5px; left: 0; } .map-legend .sym.muster::after { width: 3px; height: 12px; left: 4.5px; top: 0; }
.map-ctl { display: flex; flex-direction: column; background: rgba(255,255,255,.96); border: 1px solid rgba(255,255,255,.6); border-radius: 10px; box-shadow: var(--shadow-float); overflow: hidden; }
.map-ctl button { width: 36px; height: 36px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-2); border-bottom: 1px solid var(--border); }
.map-ctl button:last-child { border-bottom: 0; }
.map-ctl button:hover { color: var(--text); background: var(--bg); }
.map-panel { background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.7); border-radius: var(--r-l); box-shadow: var(--shadow-float); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
.map-panel .eyebrow { font-size: 11px; }
.map-scale { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.map-scale i { display: block; height: 4px; width: 80px; border: 1px solid var(--pageo-carbon); border-top: 0; }
.map-coords { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; background: rgba(255,255,255,.9); padding: 4px 10px; border-radius: var(--r-pill); box-shadow: var(--shadow-1); }

/* Markers */
.mk { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; z-index: 2; }
.mk .sym { display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(20,29,34,.25); border: 2px solid #fff; }
.mk.person .sym { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; }
.mk.person .sym .ic { width: 14px; height: 14px; }
.mk.person.crit .sym { background: var(--s-crit); }
.mk.person.off .sym { background: var(--s-offline); }
.mk.person.warn .sym { background: var(--s-warn); }
.mk.asset .sym { width: 22px; height: 22px; border-radius: 5px; background: var(--pageo-carbon); color: #fff; transform: rotate(45deg); }
.mk.asset .sym .ic { width: 12px; height: 12px; transform: rotate(-45deg); }
.mk.asset.warn .sym { background: var(--s-warn); } .mk.asset.crit .sym { background: var(--s-crit); }
.mk.vessel .sym { width: 30px; height: 30px; border-radius: 8px; background: var(--pageo-deep); color: #fff; }
.mk.vessel .sym .ic { width: 16px; height: 16px; }
.mk.site .sym { width: 20px; height: 20px; border-radius: 4px; background: var(--pageo-slate); color: #fff; } .mk.site .sym .ic { width: 12px; height: 12px; }
.mk.reader .sym { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--pageo-carbon); box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(20,29,34,.25); }
.mk.reader.off .sym { border-color: var(--s-offline); }
.mk.muster .sym { width: 24px; height: 24px; border-radius: 50%; background: var(--s-success); color: #fff; } .mk.muster .sym .ic { width: 14px; height: 14px; }
.mk.cluster .sym { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; box-shadow: 0 0 0 6px rgba(22,143,191,.2), 0 2px 6px rgba(20,29,34,.25); }
.mk.cluster.asset .sym { transform: none; background: var(--pageo-carbon); border-radius: 50%; box-shadow: 0 0 0 6px rgba(36,41,45,.15); }
.mk .lbl { font-size: 11px; font-weight: 600; color: var(--pageo-carbon); background: rgba(255,255,255,.94); padding: 3px 7px; border-radius: 6px; white-space: nowrap; box-shadow: 0 1px 3px rgba(20,29,34,.14); }
.mk .lbl small { display: block; font-weight: 400; color: var(--text-2); font-size: 11px; }
.mk .accuracy { position: absolute; border-radius: 50%; background: rgba(22,143,191,.12); border: 1px solid rgba(22,143,191,.4); z-index: -1; }
.mk.me .sym { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(20,29,34,.3); position: relative; }
.mk.me .sym::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid var(--accent); opacity: .5; animation: pulse 2.4s ease-out infinite; }

/* Marker popup */
.popup { position: absolute; z-index: 5; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-modal); border: 1px solid var(--border); padding: 14px 16px; min-width: 210px; display: flex; flex-direction: column; gap: 8px; transform: translate(-50%, calc(-100% - 22px)); }
.popup::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--surface); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transform: translateX(-50%) rotate(45deg); }
.popup.static { position: relative; transform: none; box-shadow: none; } .popup.static::after { display: none; }
.popup .p-head { display: flex; align-items: center; gap: 10px; }
.popup .p-title { font-size: 14px; font-weight: 600; }
.popup .p-sub { font-size: 12px; color: var(--text-2); }
.popup .kv { gap: 4px 16px; font-size: 12px; }
.popup .p-actions { display: flex; gap: 6px; margin-top: 4px; }
.popup .p-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }

/* ---------- Charts (CSS) ---------- */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.bars .bar { flex: 1; background: var(--seq-5); border-radius: 4px 4px 2px 2px; position: relative; min-width: 8px; transition: opacity .12s; }
.bars .bar:hover { opacity: .8; }
.bars .bar.s1 { background: var(--seq-1); } .bars .bar.s2 { background: var(--seq-2); } .bars .bar.s3 { background: var(--seq-3); } .bars .bar.s4 { background: var(--seq-4); } .bars .bar.s5 { background: var(--seq-5); } .bars .bar.s6 { background: var(--seq-6); }
.bars .bar.muted { background: var(--pageo-mist); }
.bar-labels { display: flex; gap: 6px; } .bar-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbars .hb { display: grid; grid-template-columns: 120px 1fr 48px; align-items: center; gap: 12px; font-size: 13px; }
.hbars .hb .track { height: 8px; background: var(--pageo-mist); border-radius: 4px; overflow: hidden; }
.hbars .hb .track i { display: block; height: 100%; background: var(--seq-5); border-radius: 4px; }
.hbars .hb .track i.s2 { background: var(--seq-3); } .hbars .hb .track i.s3 { background: var(--seq-4); } .hbars .hb .track i.s4 { background: var(--seq-6); }
.hbars .hb .track i.ok { background: var(--s-success); } .hbars .hb .track i.warn { background: var(--s-warn); } .hbars .hb .track i.crit { background: var(--s-crit); } .hbars .hb .track i.off { background: var(--s-offline); }
.hbars .hb .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.stackbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--pageo-mist); gap: 2px; }
.stackbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 12px 18px; font-size: 12px; color: var(--text-2); }

/* Steps / flow */
.flow { display: flex; align-items: center; gap: 0; overflow-x: auto; }

.m-avatar-row { display: flex; align-items: center; } .m-avatar-row .avatar { border: 2px solid var(--surface); margin-left: -8px; width: 32px; height: 32px; } .m-avatar-row .avatar:first-child { margin-left: 0; }

/* SOS hold control */

.ds { min-height: 100vh; background: var(--bg); display: grid; grid-template-columns: 240px 1fr; }

.ds-main { min-width: 0; padding: 40px 48px 80px; display: flex; flex-direction: column; gap: 48px; max-width: 1400px; }

.ds-desc { font-size: 13px; color: var(--text-2); max-width: 65ch; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
.swatch { display: flex; flex-direction: column; gap: 8px; }

.ds-specimen { display: grid; grid-template-columns: 200px 1fr; gap: 12px 24px; align-items: baseline; }

.ds-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.ds-token { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); padding: 2px 6px; border-radius: 4px; color: var(--pageo-deep); }
.spacing-row { display: flex; align-items: flex-end; gap: 16px; }

/* Utility */
.hide { display: none !important; }
.right { text-align: right; }
.center { text-align: center; }
.w100 { width: 100%; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.ml-auto { margin-left: auto; }
.nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Logo image ---------- */

.logo-mark img, .brand img { display: block; width: 100%; height: auto; }

.brand { display: block; width: 92px; }
@media (max-width: 1439px) { .sidebar .logo-mark { width: 44px; } }

/* ---------- OpenLayers map engine ---------- */

.map .ol-base .ol-viewport { border-radius: inherit; }

.map-attr { position: absolute; right: 56px; bottom: 14px; z-index: 4; font-size: 11px; color: var(--text-2); background: rgba(255,255,255,.82); padding: 2px 7px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
.m-map .map-attr, .map.flush .map-attr { right: 12px; bottom: 60px; }
.ol-viewport { touch-action: none; }

/* ---------- Demo toasts & button flash ---------- */
#pn-toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }

/* ---------- Map overlay stacking & small maps ---------- */

.ol-overlay-container:has(.mk.crit), .ol-overlay-container:has(.mk.me) { z-index: 4; }
.ol-overlay-container:has(.popup) { z-index: 20; }

.map[data-small] .map-ctl { display: none; }
.map[data-small] .map-legend { display: none; }

/* ============================================================
   MOBILE v3 — modern, colorful, field-friendly
   ============================================================ */
:root { --m-ocean: #1A9BCB; --m-deep: #0B76A3; --m-green: #22A876; --m-green-2: #15825A; --m-amber: #F0B23A; --m-amber-2: #D89414; --m-violet: #8A7CE8; --m-violet-2: #6B5BD2; --m-teal: #2FC0C9; --m-teal-2: #0FA3B1; --m-red: #E2605E; --m-red-2: #C43D3D; --m-slate: #7F8C95; --m-slate-2: #5C6870; }
.screen { background: linear-gradient(180deg, #E4F2F9 0px, #F3F5F7 280px); }
.m-top { padding: 6px 20px 10px; }
.m-top .m-title { font-size: 24px; letter-spacing: -.02em; }
.m-top .back { border-radius: 14px; width: 42px; height: 42px; }
.m-body { padding: 4px 16px 28px; gap: 14px; }

.m-section { padding: 6px 6px 0; }

/* Hero */
.m-hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; color: #fff; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(135deg, #1D9FD0 0%, #0E7BA8 55%, #085C80 100%); box-shadow: 0 14px 30px rgba(8,105,143,.28); }

.m-hero > * { position: relative; z-index: 1; }
.m-hero.green { background: linear-gradient(135deg, #27B382 0%, #178A5F 55%, #0F6A48 100%); box-shadow: 0 14px 30px rgba(23,135,93,.28); }
.m-hero.red { background: linear-gradient(135deg, #E8625F 0%, #C43D3D 55%, #9E2C2C 100%); box-shadow: 0 14px 30px rgba(196,61,61,.30); }

.m-hero .m-tracking.off { background: rgba(255,255,255,.14); color: rgba(255,255,255,.85); } .m-hero .m-tracking.off .dot { background: transparent; border-color: rgba(255,255,255,.7); }
.m-hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; }

.m-hero-stats .hs b { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

.m-hero-actions { display: flex; gap: 10px; margin-top: 4px; }

.m-hero .m-btn.glass { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.28); }

.m-hero .m-progress { background: rgba(255,255,255,.22); } .m-hero .m-progress i { background: #fff; }
.m-hero .big { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.m-hero .big small { font-size: 16px; font-weight: 600; opacity: .8; letter-spacing: 0; }

/* Quick actions & tiles */
.m-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 2px 0; }
.m-actions a { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text); text-align: center; }
.ai { width: 58px; height: 58px; border-radius: 19px; display: inline-flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 8px 16px rgba(20,29,34,.14); }
.ai .ic { width: 25px; height: 25px; }

.m-tiles .tile .ti { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px; background: #E1F1FA; color: var(--m-deep); }

/* Buttons */
.m-btn { height: 56px; border-radius: 16px; font-size: 16px; }

  /* ---------- Web shell ---------- */
  function buildWebShell(root) {
    if (root.querySelector(':scope > .sidebar')) return;
    const active = root.getAttribute('data-nav') || '';
    const crumb = (root.getAttribute('data-crumb') || 'Global / Overview').split('/').map(function (s) { return s.trim(); });
    const page = root.querySelector('#page') || root.firstElementChild;

    let sb = '<aside class="sidebar">' + logo(false);
    PN.webNav.forEach(function (g) {
      sb += '<div class="sb-group"><div class="eyebrow">' + g.group + '</div>';
      g.items.forEach(function (it) {
        sb += '<a class="sb-item' + (it.id === active ? ' active' : '') + '" href="' + it.href + '" data-route="' + it.id + '">' + PN.icon(it.icon) + '<span>' + it.label + '</span>' + (it.badge ? '<span class="badge">' + it.badge + '</span>' : '') + '</a>';
      });
      sb += '</div>';
    });
    sb += '<div class="sb-foot"><div class="user"><span class="avatar">OM</span><div><div class="name">Operations Manager</div><div class="role">PT Pageo Utama · Jakarta</div></div></div><div class="sb-version">Navigator v1.0 · 2026</div></div></aside>';

    let cr = '<div class="crumb">';
    crumb.forEach(function (c, i) {
      cr += (i ? '<span class="sep">/</span>' : '') + '<span class="' + (i === crumb.length - 1 ? 'cur' : '') + '">' + c + '</span>';
    });
    cr += '</div>';
    const tb = '<header class="topbar">' + cr +
      '<div class="input search"><i data-icon="search"></i><input type="search" placeholder="Search people, assets, projects…" aria-label="Search"></div>' +
      '<div class="tb-actions"><span class="tb-clock" data-clock>04 Sep 2026 · 16:21 WIB</span>' +
      '<button class="icon-btn" aria-label="Notifications"><i data-icon="bell"></i><span class="pip"></span></button>' +
      '<button class="icon-btn" aria-label="Help"><i data-icon="info"></i></button>' +
      '<span class="avatar">OM</span></div></header>';

    const main = document.createElement('div');
    main.className = 'main';
    main.innerHTML = tb;
    root.insertAdjacentHTML('afterbegin', sb);
    root.appendChild(main);
    main.appendChild(page);
  }

  /* ---------- Mobile shell ---------- */
  function buildPhoneChrome(phone) {
    if (phone.hasAttribute('data-chromed')) return;
    phone.setAttribute('data-chromed', '1');
    const screen = phone.querySelector('.screen');
    if (!screen) return;
    const nav = phone.getAttribute('data-mnav');
    const time = phone.getAttribute('data-time') || '15:42';
    const offline = phone.hasAttribute('data-offline');
    const low = phone.hasAttribute('data-lowbatt');
    const status = '<div class="m-status"><span>' + time + '</span><span class="right">' +
      (offline ? PN.icon('wifioff') : PN.icon('signal')) + '<span class="batt' + (low ? ' low' : '') + '"><i></i></span></span></div>';
    screen.insertAdjacentHTML('afterbegin', '<div class="notch"></div>' + status);
    if (nav && nav !== 'none') {
      let n = '<nav class="m-nav">';
      PN.mobileNav.forEach(function (it) {
        n += '<a href="' + it.href + '" class="' + (it.id === nav ? 'active' : '') + '" data-route="' + it.id + '">' + PN.icon(it.icon) + it.label + '</a>';
      });
      n += '</nav>';
      screen.insertAdjacentHTML('beforeend', n);
    }
    screen.insertAdjacentHTML('beforeend', '<div class="home-bar"></div>');
  }

/* ---------- Charts (SVG, no dependencies) · Modal · Popover menu ---------- */
(function () {
  const C = window.C, PN = window.PN, esc = C.esc;
  function niceMax(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10; return n * p; }
  C.areaChart = function (o) {
    const series = o.series || [{ values: o.values, color: o.color || '#168FBF', label: o.label }];
    const n = series[0].values.length, w = o.w || 600, h = o.h || 190, L = 38, R = 14, T = 16, B = 30;
    const max = niceMax(Math.max.apply(null, series.map(s => Math.max.apply(null, s.values))) * 1.08);
    const px = i => L + i * (w - L - R) / Math.max(1, n - 1), py = v => T + (h - T - B) * (1 - v / max);
    let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart-svg" role="img" aria-label="' + esc(o.label || 'chart') + '">';
    const steps = 4;
    for (let i = 0; i <= steps; i++) { const v = max * i / steps, y = py(v); s += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#E6EAED" stroke-width="1"/><text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#667078" font-family="Inter,sans-serif">' + (Number.isInteger(v) ? v : v.toFixed(1)) + '</text>'; }
    series.forEach(function (sr) {
      const pts = sr.values.map((v, i) => [px(i), py(v)]);
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      if (sr.area !== false) s += '<path d="' + d + ' L' + pts[pts.length - 1][0].toFixed(1) + ',' + py(0) + ' L' + pts[0][0].toFixed(1) + ',' + py(0) + ' Z" fill="' + sr.color + '" fill-opacity="' + (sr.fillOpacity != null ? sr.fillOpacity : .10) + '"/>';
      s += '<path d="' + d + '" fill="none" stroke="' + sr.color + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"' + (sr.dash ? ' stroke-dasharray="5 4"' : '') + '/>';
      if (o.dots !== false) pts.forEach((p, i) => { if (i === pts.length - 1 || o.allDots) s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="#fff" stroke="' + sr.color + '" stroke-width="2"/>'; });
      if (o.valueLabels) pts.forEach((p, i) => { s += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 8).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#24292D" font-family="Inter,sans-serif">' + sr.values[i] + '</text>'; });
    });
    if (o.labels) { const stride = Math.ceil(o.labels.length / (o.maxLabels || 8)); o.labels.forEach((l, i) => { if (i % stride === 0 || i === o.labels.length - 1) s += '<text x="' + px(i).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" font-size="11" fill="#667078" font-family="Inter,sans-serif">' + esc(l) + '</text>'; }); }
    s += '</svg>';
    return '<div class="chart">' + s + (series.length > 1 || o.legend ? C.legend(series.map(sr => ({ label: sr.label, color: sr.color }))) : '') + '</div>';
  };
  C.barChart = function (o) {
    const vals = o.values, n = vals.length, w = o.w || 600, h = o.h || 180, L = 36, R = 10, T = 18, B = 28;
    const max = niceMax(Math.max.apply(null, vals) * 1.1), bw = (w - L - R) / n, gap = Math.min(10, bw * .3);

/* ============================================================
   PAGEO Navigator — local data store (CRUD demo)
   Seeds from DATA, persists to localStorage so edits survive reloads.
   ============================================================ */
(function () {
  const PN = window.PN;
  const KEY = 'pageo-navigator-store-v1';
  let db = null;
  const clone = function (x) { return JSON.parse(JSON.stringify(x)); };
  function seed() { const D = window.DATA; return { v: 1, people: clone(D.people), assets: clone(D.assets), projects: clone(D.projects), alerts: clone(D.alerts) }; }
  function load() {
    if (db) return db;
    try { const raw = localStorage.getItem(KEY); if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.v === 1) { db = parsed; return db; } } } catch (e) {}
    db = seed(); save(); return db;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  PN.store = {
    all: function (c) { return load()[c] || []; },
    get: function (c, id) { return load()[c].find(function (x) { return x.id === id; }); },
    add: function (c, item) { load()[c].unshift(item); save(); return item; },
    update: function (c, id, patch) { const it = PN.store.get(c, id); if (it) Object.assign(it, patch); save(); return it; },
    remove: function (c, id) { const arr = load()[c]; const i = arr.findIndex(function (x) { return x.id === id; }); if (i >= 0) arr.splice(i, 1); save(); return i >= 0; },
    reset: function () { db = null; try { localStorage.removeItem(KEY); } catch (e) {} load(); },
    count: function (c, fn) { return PN.store.all(c).filter(fn || function () { return true; }).length; }
  };
})();

/* ============================================================
   PAGEO Navigator — per-app hash router
   PN.app({ kind: 'web' | 'mobile' | 'ds', home: 'overview' })
   Pages register with PN.page(id, { title, nav, crumb, render, after, hidden })
   Links: href="personnel.html" or "#personnel" → route; hrefs with a "/" leave the app.
   ============================================================ */
(function () {
  const PN = window.PN;
  PN.pages = {}; PN.order = [];
  PN.page = function (id, def) { def.id = id; PN.pages[id] = def; if (PN.order.indexOf(id) < 0) PN.order.push(id); };
  let cfg = null, current = null;

  function resolve(href) {
    if (!href || /^(https?:|mailto:|tel:)/.test(href) || href === '#') return null;
    if (href.charAt(0) === '#') return href.slice(1) || null;
    if (href.indexOf('/') >= 0) return null;
    if (/\.html(\?.*)?$/.test(href)) return href.replace(/\.html(\?.*)?$/, '$1');
    return null;
  }

  PN.route = function (id, opts) {
    opts = opts || {};
    let qs = ''; const qi = (id || '').indexOf('?');
    if (qi >= 0) { qs = id.slice(qi + 1); id = id.slice(0, qi); }
    const params = {}; if (qs) { qs.split('&').forEach(function (kv) { const p = kv.split('='); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); }
    PN.params = params;
    if (!PN.pages[id]) id = cfg.home;
    const def = PN.pages[id];
    const full = id + (qs ? '?' + qs : '');
    const stage = document.getElementById('stage');
    Array.prototype.slice.call(stage.attributes).forEach(function (a) { if (a.name.indexOf('data-') === 0) stage.removeAttribute(a.name); });
    stage.className = cfg.kind;
    if (def.nav != null && cfg.kind !== 'mobile') stage.setAttribute('data-nav', def.nav);
    if (def.crumb) stage.setAttribute('data-crumb', def.crumb);
    if (cfg.kind === 'mobile') {
      stage.innerHTML = '<div class="phone" data-mnav="' + (def.nav || 'none') + '" data-time="' + (def.time || '15:42') + '"' + (def.offline ? ' data-offline' : '') + (def.lowbatt ? ' data-lowbatt' : '') + '><div class="screen' + (def.dark ? ' dark' : '') + '">' + def.render() + '</div></div>';
    } else {
      stage.innerHTML = '<main class="page' + (def.pageCls ? ' ' + def.pageCls : '') + '" id="page">' + def.render(params) + '</main>';
    }
    current = full;
    PN.init(stage);
    if (def.after) def.after(stage);
    stage.scrollTop = 0;
    document.title = def.title + ' · ' + cfg.title;
    if (location.hash !== '#' + full) { if (opts.replace) history.replaceState(null, '', '#' + full); else history.pushState(null, '', '#' + full); }
    if (cfg.onRoute) cfg.onRoute(id, def);
  };
  PN.current = function () { return current; };

  PN.app = function (c) {
    cfg = c;
    document.addEventListener('DOMContentLoaded', function () {
      const stage = document.getElementById('stage');
      stage.addEventListener('click', function (e) {
        const a = e.target.closest('a[href]'); if (!a) return;
        const href = a.getAttribute('href');
        if (href === '#') { e.preventDefault(); return; }
        const id = resolve(href);
        if (id) { e.preventDefault(); PN.route(id); }
      });
      document.addEventListener('click', function (e) {
        const g = e.target.closest('[data-go]'); if (g && PN.pages[g.getAttribute('data-go')]) { e.preventDefault(); PN.route(g.getAttribute('data-go')); }
      });
      window.addEventListener('hashchange', function () { const id = location.hash.slice(1); if (id !== current) PN.route(id, { replace: true }); });
      if (cfg.setup) cfg.setup();
      PN.route(location.hash.slice(1) || cfg.home, { replace: true });
    });
  };
})();

/* ============================================================
   Dashboard engines: PN.registry (filterable table + summary-card filters + row CRUD)
                      PN.form (create / edit page bound to PN.store)
   ============================================================ */
(function () {
  const PN = window.PN, C = window.C, esc = C.esc;

  PN.registry = function (cfg) {
    const state = { q: '', f: {} };
    function all() { return PN.store.all(cfg.coll); }
    function filtered() {
      const q = state.q.trim().toLowerCase();
      return all().filter(function (r) {
        for (const k in state.f) { if (state.f[k] && String(r[k]) !== String(state.f[k])) return false; }
        if (q && !(cfg.search ? cfg.search(r, q) : JSON.stringify(r).toLowerCase().indexOf(q) >= 0)) return false;
        return true;
      });
    }
    function kpiHtml() {
      const rows = all();
      return '<div class="grid kpis g16" style="grid-template-columns:repeat(' + cfg.kpis.length + ',minmax(0,1fr))">' + cfg.kpis.map(function (k) {
        const value = typeof k.value === 'function' ? k.value(rows) : k.value;
        const f = k.filter; const active = f && state.f[f.key] === f.value;
        return C.kpi({ label: k.label, value: value, icon: k.icon, iconKind: k.iconKind, lines: k.lines, compact: true, cls: (f ? 'filter' : '') + (active ? ' active' : ''), attr: f ? 'data-filter="' + esc(f.key) + '=' + esc(f.value) + '" role="button" tabindex="0"' : '' });
      }).join('') + '</div>';
    }
    function filtersHtml() {
      const rows = all();
      return '<div class="filters">' + C.input({ icon: 'search', placeholder: cfg.placeholder || 'Search…', sm: true, style: 'width:260px', value: state.q }).replace('<input ', '<input data-custom data-search ') +
        (cfg.filters || []).map(function (f) {
          const opts = typeof f.options === 'function' ? f.options(rows) : f.options || Array.from(new Set(rows.map(function (r) { return r[f.key]; }))).filter(Boolean).sort();
          return C.selectNative({ name: f.key, icon: f.icon, sm: true, placeholder: (f.label || f.key) + ' · All', options: opts, value: state.f[f.key] || '', attr: 'data-filter-select="' + f.key + '"', style: 'min-width:170px' });
        }).join('') + (cfg.extraFilters || '') + '</div><div class="filter-bar" id="reg-fbar"></div>';
    }
    function fbarHtml(n) {
      const chips = [];
      if (state.q) chips.push({ k: 'q', label: 'Search: “' + esc(state.q) + '”' });
      for (const k in state.f) if (state.f[k]) { const f = (cfg.filters || []).find(function (x) { return x.key === k; }); const kp = cfg.kpis.find(function (x) { return x.filter && x.filter.key === k; }); chips.push({ k: k, label: ((f && f.label) || (kp && kp.filterLabel) || k) + ': ' + esc(cfg.labelFor ? cfg.labelFor(k, state.f[k]) : state.f[k]) }); }
      return (chips.length ? '<span>Filters</span>' + chips.map(function (c) { return '<span class="fchip">' + c.label + '<button data-clear="' + c.k + '" aria-label="Remove filter">' + PN.icon('x') + '</button></span>'; }).join('') + '<button class="clear" data-clear="*">Clear all</button>' : '<span class="muted">No filters · click a summary card or use the selects to filter</span>') +
        '<span class="count">' + n + ' of ' + all().length + ' ' + (cfg.noun || 'rows') + '</span>';
    }
    function tableHtml(rows) {
      const cols = cfg.cols.concat([{ key: '_act', label: '', cls: 'actions', render: function (r) { return '<button class="btn ghost xs icon-only" data-menu="' + esc(cfg.rowId(r)) + '" data-bound="1" aria-label="Row actions">' + PN.icon('more') + '</button>'; } }]);
      if (!rows.length) return '<div class="card p0">' + C.empty({ icon: cfg.emptyIcon || 'search', title: 'No ' + (cfg.noun || 'rows') + ' match', text: 'Try clearing a filter or searching for a different term.' }) + '</div>';
      return C.table({ sortable: true, cols: cols, rows: rows, footText: 'Showing ' + rows.length + ' of ' + all().length + ' ' + (cfg.noun || 'rows'), pages: Math.max(1, Math.ceil(all().length / 12)) });
    }
    function render() {
      const p = PN.params || {};
      (cfg.filters || []).forEach(function (f) { if (p[f.key]) state.f[f.key] = p[f.key]; });
      cfg.kpis.forEach(function (k) { if (k.filter && p[k.filter.key]) state.f[k.filter.key] = p[k.filter.key]; });
      if (p.q) state.q = p.q;
      return C.pageHead({ eyebrow: cfg.eyebrow, title: cfg.title, sub: cfg.sub, actions: (cfg.actions || '') + C.btn('Export', 'ghost sm', 'download') + (cfg.newHref ? '<a class="btn primary sm" href="' + cfg.newHref + '">' + PN.icon('plus') + esc(cfg.newLabel || 'New') + '</a>' : '') }) +
        '<div id="reg-kpis">' + kpiHtml() + '</div>' + (cfg.extra || '') + '<div id="reg-filters">' + filtersHtml() + '</div><div id="reg-table"></div>';
    }
    function after(stage) {
      const root = stage;
      function draw() {
        const rows = filtered();
        root.querySelector('#reg-table').innerHTML = tableHtml(rows);
        root.querySelector('#reg-fbar').innerHTML = fbarHtml(rows.length);
        root.querySelector('#reg-kpis').innerHTML = kpiHtml();
        PN.initFragment(root.querySelector('#reg-table')); PN.initFragment(root.querySelector('#reg-kpis')); PN.renderIcons(root.querySelector('#reg-fbar'));
        bindKpis(); bindMenus(); bindFbar();
        root.querySelectorAll('[data-filter-select]').forEach(function (s) { s.value = state.f[s.getAttribute('data-filter-select')] || ''; });
      }
      function bindKpis() {
        root.querySelectorAll('[data-filter]').forEach(function (k) {
          k.addEventListener('click', function () { const kv = k.getAttribute('data-filter').split('='); state.f[kv[0]] = state.f[kv[0]] === kv[1] ? '' : kv[1]; draw(); });
          k.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); k.click(); } });
        });
      }
      function bindMenus() {
        root.querySelectorAll('[data-menu]').forEach(function (b) {
          b.addEventListener('click', function (e) {
            e.stopPropagation(); const id = b.getAttribute('data-menu'); const r = PN.store.get(cfg.coll, id); if (!r) return;
            PN.menu(b, [
              { icon: 'eye', label: 'View details', href: cfg.detailHref(r) },
              { icon: 'pencil', label: 'Edit', href: cfg.editHref(r) },
              cfg.extraMenu ? cfg.extraMenu(r, draw) : null, '-',
              { icon: 'trash', label: 'Delete', danger: true, onClick: function () { PN.confirm({ title: 'Delete ' + esc(cfg.deleteLabel(r)) + '?', text: cfg.deleteText || 'This removes the record from the registry. History and reports keep their own copies.', onConfirm: function () { PN.store.remove(cfg.coll, id); PN.toast('Deleted ' + cfg.deleteLabel(r), 'trash'); draw(); } }); } }
            ].filter(Boolean));
          });
        });
      }
      function bindFbar() {
        root.querySelectorAll('[data-clear]').forEach(function (b) { b.addEventListener('click', function () { const k = b.getAttribute('data-clear'); if (k === '*') { state.q = ''; state.f = {}; const si = root.querySelector('[data-search]'); if (si) si.value = ''; } else if (k === 'q') { state.q = ''; const si = root.querySelector('[data-search]'); if (si) si.value = ''; } else state.f[k] = ''; draw(); }); });
      }
      const si = root.querySelector('[data-search]'); if (si) si.addEventListener('input', function () { state.q = si.value; draw(); });
      root.querySelectorAll('[data-filter-select]').forEach(function (s) { s.addEventListener('change', function () { state.f[s.getAttribute('data-filter-select')] = s.value; draw(); }); });
      draw();
      if (cfg.after) cfg.after(root, draw);
    }
    return { render: render, after: after };
  };

  PN.form = function (cfg) {
    function field(f, rec) {
      const v = rec ? (f.get ? f.get(rec) : rec[f.name]) : (f.default || '');
      const html = f.type === 'select' ? C.selectNative({ name: f.name, label: f.label, options: f.options, value: v, icon: f.icon, placeholder: f.placeholder, help: f.help }) : C.textInput({ name: f.name, label: f.label, value: v, type: f.type || 'text', icon: f.icon, placeholder: f.placeholder, required: f.required, help: f.help, textarea: f.type === 'textarea', attr: f.required ? 'data-required' : '' });
      return '<div class="' + (f.span2 ? 'span2' : '') + '">' + html + '</div>';
    }
    return {
      render: function (params) {
        const id = params && params.id; const rec = id ? PN.store.get(cfg.coll, id) : null; const edit = !!rec;
        const sections = cfg.sections.map(function (s) { return '<div class="form-section">' + C.eyebrow(s.title) + '<div class="form-grid">' + s.fields.map(function (f) { return field(f, rec); }).join('') + '</div></div>'; }).join('');
        return C.pageHead({ eyebrow: cfg.eyebrow, title: edit ? (cfg.editTitle ? cfg.editTitle(rec) : 'Edit ' + cfg.noun) : 'New ' + cfg.noun, sub: edit ? (cfg.editSub ? cfg.editSub(rec) : 'Changes are saved to the local registry') : cfg.newSub,
            actions: '<a class="btn ghost sm" href="' + cfg.backHref + '">' + PN.icon('arrowleft') + 'Back to ' + cfg.backLabel + '</a>' }) +
          C.grid([C.col(8, '<form id="pn-form" class="card p24" style="gap:28px" data-edit="' + (edit ? '1' : '') + '" data-id="' + esc(id || '') + '">' + sections + '<div class="row between"><div>' + (edit ? C.btn('Delete ' + cfg.noun, 'destructive', 'trash', 'data-bound="1" id="pn-delete"') : '') + '</div><div class="row s8"><a class="btn ghost" href="' + cfg.backHref + '">Cancel</a>' + C.btn(edit ? 'Save changes' : 'Create ' + cfg.noun, 'primary', 'check', 'data-bound="1" id="pn-save" type="submit"') + '</div></div></form>'),
            C.col(4, C.card({ title: edit ? 'Record' : 'Before you save', body: edit ? C.kv(cfg.summary(rec), { stack: true }) : '<div class="stack s12 t-body muted" style="font-size:13px">' + (cfg.tips || []).map(function (t) { return '<div class="row top s8">' + PN.icon('info', 'ic-16') + '<span>' + t + '</span></div>'; }).join('') + '</div>' }) + (cfg.side ? cfg.side(rec) : ''))]);
      },
      after: function (stage) {
        const form = stage.querySelector('#pn-form'); if (!form) return;
        const edit = form.getAttribute('data-edit') === '1', id = form.getAttribute('data-id');
        function values() { const v = {}; form.querySelectorAll('[name]').forEach(function (el) { v[el.name] = el.value.trim(); }); return v; }
        function validate() { let ok = true; form.querySelectorAll('[data-required]').forEach(function (el) { const fld = el.closest('.field'); fld.classList.toggle('invalid', !el.value.trim()); let err = fld.querySelector('.err'); if (!el.value.trim()) { ok = false; if (!err) { fld.insertAdjacentHTML('beforeend', '<div class="err">' + PN.icon('alert', 'ic-14') + 'This field is required.</div>'); } } else if (err) err.remove(); }); return ok; }
        form.addEventListener('submit', function (e) {
          e.preventDefault(); if (!validate()) { PN.toast('Please complete the required fields', 'alert'); return; }
          const v = values(); const existing = edit ? PN.store.get(cfg.coll, id) : null;
          const rec = cfg.toRecord(v, existing);
          if (edit) { PN.store.update(cfg.coll, id, rec); PN.toast('Saved ' + cfg.label(rec), 'checkcircle'); }
          else { if (PN.store.get(cfg.coll, rec.id)) { PN.toast(rec.id + ' already exists — choose another ID', 'alert'); return; } PN.store.add(cfg.coll, rec); PN.toast('Created ' + cfg.label(rec), 'checkcircle'); }
          PN.route(cfg.backHref.replace('.html', '') + (edit ? '' : '?q=' + encodeURIComponent(rec.id)));
        });
        const del = stage.querySelector('#pn-delete'); if (del) del.addEventListener('click', function () { const rec = PN.store.get(cfg.coll, id); PN.confirm({ title: 'Delete ' + esc(cfg.label(rec)) + '?', text: 'This removes the record from the registry.', onConfirm: function () { PN.store.remove(cfg.coll, id); PN.toast('Deleted ' + cfg.label(rec), 'trash'); PN.route(cfg.backHref.replace('.html', '')); } }); });
      }
    };
  };
})();
